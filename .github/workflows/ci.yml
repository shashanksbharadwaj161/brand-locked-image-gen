name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — compile & dry-run pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Byte-compile all modules
        run: python -m py_compile backend/*.py
      - name: Run pipeline tests (no API calls)
        run: python tests/test_pipeline.py

  frontend:
    name: Frontend — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check frontend scripts
        run: |
          node --check frontend/app.js
          node --check frontend/zip.js
